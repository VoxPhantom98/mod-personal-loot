name: Installation and transaction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get supported core
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: 7f12e89ee5f467a50e62eba1d525eac7dc953d03
          path: core
      - name: Get supported Playerbots
        uses: actions/checkout@v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: 7bae1b5c58c76a0aa20381155edc08096d1485b2
          path: core/modules/mod-playerbots
      - name: Check and apply patches
        run: |
          python3 tools/install.py --core core --dry-run
          python3 tools/install.py --core core
          python3 tools/install.py --core core --dry-run
      - name: Build transaction tests
        run: |
          cmake -S tests -B build-tests -DPERSONAL_LOOT_CORE_PATH="$PWD/core"
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure
